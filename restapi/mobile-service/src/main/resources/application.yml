server:
  port: ${PORT:9003}

project:
  name: @project.name@
  version: @project.version@
  description: @project.description@
  openapi:
    url: ${PROJECT_OPENAPI_URL:http://localhost:${server.port}/}

sistema:
  sigla: ANDROID

api:
  auth:
    url: "${AUTH_SERVICE_URL:https://auth-api.mppb.mp.br}"

spring:
  profiles:
    # prod = usar em produção (secure)
    # dev = usar em desenvolvimento (trace)
    # insecure = dispensa exigência de token de autorização nas chamadas.
    # trace = força incluir trace na resposta http de erros em qualquer ambiente (mesmo prod)
    active: ${SPRING_PROFILES_ACTIVE:}
  http:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
  datasource:
    url: jdbc:${PG_URL:}
    username: ${PG_USERNAME:}
    password: ${PG_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${POOL_MAX:10}
      minimum-idle: ${POOL_MIN:2}
      connection-timeout: ${POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${POOL_MAX_LIFETIME_MS:1800000}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:5MB}
  jackson:
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: true
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd

cors:
  enabled: ${CORS_ENABLED:false}
  access-control-headers:
    allow-origin: ${ACCESS_CONTROL_ALLOW_ORIGIN:*}
    allow-credentials: ${ACCESS_CONTROL_ALLOW_CREDENTIALS:false}

security:
  public-api:
    rate-limit:
      search-per-minute: ${PROCESS_SEARCH_RATE_LIMIT:10}
      details-per-minute: ${PROCESS_DETAILS_RATE_LIMIT:10}
      captcha-per-minute: ${CAPTCHA_RATE_LIMIT:20}
      max-clients: ${PUBLIC_RATE_LIMIT_MAX_CLIENTS:10000}
    captcha:
      max-pending: ${CAPTCHA_MAX_PENDING:5000}

carteira:
  pgj-fallback: ${CARTEIRA_PGJ_FALLBACK:ANTONIO HORTENCIO ROCHA NETO}

certidao:
  extrajudicial:
    base-url: ${CERTIDAO_EXTRAJUDICIAL_BASE_URL:https://certservapp.mppb.mp.br}
    fallback-base-url: ${CERTIDAO_EXTRAJUDICIAL_FALLBACK_BASE_URL:https://certservapp.mppb.mp.br}

mpvirtual:
  recursos-humanos:
    # Producao preservada como default. Desenvolvimento pode sobrescrever via .env.dev.
    base-url: ${MPVIRTUAL_RECURSOS_HUMANOS_BASE_URL:}
    orgao-id: ${MPVIRTUAL_RECURSOS_HUMANOS_ORGAO_ID:1464408}
    auth-mode: ${MPVIRTUAL_RECURSOS_HUMANOS_AUTH_MODE:token}

designacoes:
  notificacao:
    enabled: ${DESIGNACOES_NOTIFICACAO_ENABLED:false}
    cron: ${DESIGNACOES_NOTIFICACAO_CRON:0 */15 * * * *}
    batch-size: ${DESIGNACOES_NOTIFICACAO_BATCH_SIZE:100}
    max-tentativas: ${DESIGNACOES_NOTIFICACAO_MAX_TENTATIVAS:3}
    fcm:
      enabled: ${DESIGNACOES_FCM_ENABLED:false}
      project-id: ${FIREBASE_PROJECT_ID:appmppb}

noticias:
  notificacao:
    enabled: ${NOTICIAS_NOTIFICACAO_ENABLED:false}
    cron: ${NOTICIAS_NOTIFICACAO_CRON:0 */15 * * * *}
    batch-size: ${NOTICIAS_NOTIFICACAO_BATCH_SIZE:50}
    max-tentativas: ${NOTICIAS_NOTIFICACAO_MAX_TENTATIVAS:3}
    baseline-notificar-recentes-minutos: ${NOTICIAS_BASELINE_NOTIFICAR_RECENTES_MINUTOS:120}
    fcm:
      topic: ${NOTICIAS_FCM_TOPIC:mppb_noticias}

notificacoes-funcionais:
  enabled: ${NOTIFICACOES_FUNCIONAIS_ENABLED:false}
  cron: ${NOTIFICACOES_FUNCIONAIS_CRON:0 */15 * * * *}
  batch-size: ${NOTIFICACOES_FUNCIONAIS_BATCH_SIZE:100}
  max-tentativas: ${NOTIFICACOES_FUNCIONAIS_MAX_TENTATIVAS:3}
  max-matriculas-por-ciclo: ${NOTIFICACOES_FUNCIONAIS_MAX_MATRICULAS_POR_CICLO:300}

jcr:
  url: ${JCR_URL:}
  user: ${JCR_USER:}
  password: ${JCR_PASSWORD:}

uat:
  synthetic-users:
    enabled: ${UAT_SYNTHETIC_USERS_ENABLED:${STORE_REVIEW_ENABLED:${STORE_REVIEW_HYBRID_ENABLED:${APPLE_REVIEW_HYBRID_ENABLED:false}}}}
    jwt-secret: ${UAT_SYNTHETIC_JWT_SECRET:}
    passwords:
      uat-membro: ${UAT_MEMBER_PASSWORD:}
      uat-servidor: ${UAT_SERVER_PASSWORD:}
      google-review-membro: ${GOOGLE_REVIEW_MEMBER_PASSWORD:}
      google-review-servidor: ${GOOGLE_REVIEW_SERVER_PASSWORD:}
      apple-review-membro: ${APPLE_REVIEW_MEMBER_PASSWORD:}
      apple-review-servidor: ${APPLE_REVIEW_SERVER_PASSWORD:}

review:
  enabled: ${STORE_REVIEW_ENABLED:false}
  hybrid-enabled: ${STORE_REVIEW_HYBRID_ENABLED:false}
  apple-hybrid-enabled: ${APPLE_REVIEW_HYBRID_ENABLED:false}
  jwt-secret: ${STORE_REVIEW_JWT_SECRET:}
  valid-until: ${STORE_REVIEW_VALID_UNTIL:}
  token-ttl-seconds: ${REVIEW_TOKEN_TTL_SECONDS:86400}
  issuer: ${REVIEW_TOKEN_ISSUER:mppb-store-review}
  audience: ${REVIEW_TOKEN_AUDIENCE:mppb-mobile-review}

mppb:
  environment: ${MPPB_ENVIRONMENT:}

biometria:
  enabled: ${BIOMETRIC_LOGIN_ENABLED:false}
  credential:
    encryption-key: ${BIOMETRIC_CREDENTIAL_ENCRYPTION_KEY:}
    ttl-days: ${BIOMETRIC_CREDENTIAL_TTL_DAYS:30}
    cleanup-cron: ${BIOMETRIC_CREDENTIAL_CLEANUP_CRON:0 15 3 * * *}
