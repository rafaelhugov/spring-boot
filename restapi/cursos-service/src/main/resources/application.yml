aplicacao:
  name: @project.name@
  version: @project.version@
  description: @project.description@
  openapi:
    url: http://localhost:${server.port}/

server:
  port: ${PORT:9002}
auth-service:
  url: "${API_URL:https://auth-api.mppb.mp.br}"

microsservicos:
  bb:
    cobranca:
      url: "${BBCOBRANCA_API_URL}"
    oauth:
      token-url: "${BBCOBRANCA_API_OAUTH_TOKEN_API}"
    fundos:
      FDD:
        gw-dev-app-key: ${BBCOBRANCA_API_FDD_GWDEVAPPKEY}
        client-id: "${BBCOBRANCA_API_FDD_CLIENT_ID}"
        client-secret: "${BBCOBRANCA_API_FDD_CLIENT_SECRET}"
      FEDC:
        gw-dev-app-key: ${BBCOBRANCA_API_FEDC_GWDEVAPPKEY}
        client-id: "${BBCOBRANCA_API_FEDC_CLIENT_ID}"
        client-secret: "${BBCOBRANCA_API_FEDC_CLIENT_SECRET}"
  bc:
    selic:
      url: ${BCSELIC_API_URL}
spring:
  profiles:
    # prod = usar em produção (secure)
    # dev = usar em desenvolvimento (trace)
    # insecure = dispensa exigência de token de autorização nas chamadas.
    # trace = força incluir trace na resposta http de erros
    active: ${SPRING_PROFILES_ACTIVE:dev}
  http:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
  datasource:
    url: jdbc:${PG_URL:postgresql://localhost:5432/local}
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:senha}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${POOL_MAX:1}
      minimum-idle: ${POOL_MIN:1}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_REQUEST_SIZE:5MB}
  jackson:
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: true
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd

cors:
  enabled: ${CORS_ENABLED:false}
  access-control-headers:
    allow-origin: ${ACCESS_CONTROL_ALLOW_ORIGIN:*}
    allow-credentials: ${ACCESS_CONTROL_ALLOW_CREDENTIALS:false}
