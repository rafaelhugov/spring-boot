<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <style>
        @page { size: A4; margin: 18mm 20mm; }
        body { font-family: Arial, sans-serif; font-size: 11pt; margin: 0; }
        .cabecalho { text-align: center; font-weight: bold; margin-bottom: 22px; }
        .brasao { width: 56px; height: auto; margin-bottom: 8px; }
        .evento { text-align: center; font-size: 13pt; font-weight: bold; margin-bottom: 18px; text-transform: uppercase; }
        .detalhes { margin-bottom: 18px; line-height: 1.4; }
        .titulo-lista { text-align: center; font-weight: bold; margin-bottom: 10px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; border-top: 1px solid black; border-left: 1px solid black; margin-top: 10px; -fs-table-paginate: paginate; page-break-inside: auto; }
        thead { display: table-header-group; }
        tbody { display: table-row-group; }
        tr { page-break-inside: avoid; break-inside: avoid; }
        th, td { border-right: 1px solid black; border-bottom: 1px solid black; padding: 6px 8px; text-align: left; line-height: 1.2; vertical-align: middle; }
        th { background-color: #f2f2f2; }
        .col-num { width: 5%; text-align: center; }
        .col-nome { width: 45%; }
        .col-ass { width: 50%; }
    </style>
</head>
<body>
    <div class="cabecalho">
        <img th:if="${brasao_src != null and !brasao_src.isEmpty()}" th:src="${brasao_src}" class="brasao" alt="Brasão MPPB"/><br/>
        MINISTÉRIO PÚBLICO DO ESTADO DA PARAÍBA<br/>
        PROCURADORIA-GERAL DE JUSTIÇA<br/>
        CENTRO DE ESTUDOS E APERFEIÇOAMENTO FUNCIONAL
    </div>

    <div class="evento" th:text="${titulo_evento}">TITULO DO EVENTO</div>

    <div class="detalhes">
        <strong>LOCAL:</strong> <span th:text="${local}">Local</span><br/>
        <strong>DATA:</strong> <span th:text="${data}">Data</span> &#160;&#160;&#160;&#160;
        <strong>HORÁRIO:</strong> <span th:text="${horario}">Horário</span>
    </div>

    <div class="titulo-lista"><span th:text="${titulo_documento}">LISTA DE PRESENÇA</span> - <span th:text="${tipo_publico}">PÚBLICO</span></div>

    <th:block th:each="grupo : ${grupos_participantes}">
        <h3 th:text="${grupo.nomeGrupo}" style="margin-top: 30px; font-weight: bold; text-align: left; text-decoration: underline;">GRUPO</h3>
        <table>
            <thead>
                <tr>
                    <th class="col-num">Nº</th>
                    <th class="col-nome">NOME</th>
                    <th class="col-ass">ASSINATURA</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="part : ${grupo.participantes}">
                    <td class="col-num" th:text="${part.numero}">1</td>
                    <td class="col-nome" th:text="${part.nome}">Nome do Participante</td>
                    <td class="col-ass"></td>
                </tr>
            </tbody>
        </table>
    </th:block>

    <th:block th:if="${linhas_adicionais != null and not #lists.isEmpty(linhas_adicionais)}">
        <h3 style="margin-top: 30px; font-weight: bold; text-align: left; text-decoration: underline;">LINHAS ADICIONAIS</h3>
        <table>
            <thead>
                <tr>
                    <th class="col-num">Nº</th>
                    <th class="col-nome">NOME</th>
                    <th class="col-ass">ASSINATURA</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="adic : ${linhas_adicionais}">
                    <td class="col-num" th:text="${adic.numero}">2</td>
                    <td class="col-nome"></td>
                    <td class="col-ass"></td>
                </tr>
            </tbody>
        </table>
    </th:block>
</body>
</html>
