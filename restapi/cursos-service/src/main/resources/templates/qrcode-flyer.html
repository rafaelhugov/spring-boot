<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'DejaVu Sans', 'Arial', sans-serif;
            width: 210mm;
            height: 297mm;
            color: #1a1a1a;
            background-color: #ffffff;
        }

        .header {
            background-color: #8D1612; /* Burgundy color from MPPB */
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 28pt;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .content {
            padding: 60px 40px;
            text-align: center;
        }

        .curso-title {
            font-size: 24pt;
            font-weight: bold;
            color: #8D1612;
            margin-bottom: 20px;
        }

        .description {
            font-size: 16pt;
            color: #455a64;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .qrcode-container {
            margin: 40px auto;
            border: 2px solid #eceff1;
            padding: 20px;
            display: inline-block;
            border-radius: 20px;
            background-color: #f8f9fa;
        }

        .qrcode-image {
            width: 350px;
            height: 350px;
        }

        .instructions {
            font-size: 18pt;
            font-weight: bold;
            color: #1a1a1a;
            margin-top: 30px;
        }

        .sub-instructions {
            font-size: 14pt;
            color: #757575;
            margin-top: 10px;
        }

        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 30px 0;
            text-align: center;
            border-top: 1px solid #eceff1;
            font-size: 12pt;
            color: #9e9e9e;
        }

        .mppb-logo {
            font-weight: bold;
            color: #8D1612;
            font-size: 16pt;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Inscrições Abertas</h1>
    </div>

    <div class="content">
        <div class="curso-title" th:text="${nomeCurso}">TÍTULO DO CURSO</div>
        <div class="description" th:text="${descricaoCurso}">Descrição breve do curso para informar o interessado.</div>

        <div class="qrcode-container">
            <img th:src="${qrCodeImage}" class="qrcode-image" />
        </div>

        <div class="instructions">Aponte a câmera do seu celular</div>
        <div class="sub-instructions">Escaneie o QR Code acima para acessar o formulário de inscrição</div>
    </div>

    <div class="footer">
        <div class="mppb-logo">Ministério Público do Estado da Paraíba</div>
        <div>CEAF - Centro de Estudos e Aperfeiçoamento Funcional</div>
    </div>
</body>

</html>
