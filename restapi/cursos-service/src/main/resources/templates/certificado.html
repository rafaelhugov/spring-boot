<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <style>
        * {
            box-sizing: border-box;
        }

        @page {
            size: A4 landscape;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'DejaVu Sans', 'Arial', sans-serif;
            color: #1a1a1a;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
        }

        .content-container {
            width: 100%;
            padding-top: 70mm;
            padding-left: 30mm;
            padding-right: 30mm;
            page-break-inside: avoid;
            position: relative;
            /* garante ficar acima do background fixo */
            z-index: 1;
        }

        .text-block {
            line-height: 1.6;
            font-size: 14pt;
            text-align: justify;
            text-justify: inter-word;
        }

        /* Estilo para destacar os nomes e títulos */
        .highlight {
            font-weight: bold;
            color: #000;
        }

        .participant-name {
            font-weight: bold;
            display: inline;
        }

        .footer-block {
            margin-top: 5mm;
            text-align: right;
            font-size: 14pt;
            padding-right: 10mm;
        }

        .footer-block-nomeCurso {
            position: fixed;
            top: 175mm;
            left: 20mm;
            text-align: left;
            color: #1a1a1a;
            max-width: 170mm;
            z-index: 10;
        }

        .label-tipo {
            font-size: 11pt;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }

        .nome-curso-footer {
            font-size: 14pt;
            line-height: 1.1;
            font-weight: normal;
        }
    </style>
</head>

<body>
    <img th:src="${backgroundImage}" class="background" src="" />

    <div class="content-container">
        <div class="text-block">
            Certificamos que
            <span class="participant-name" th:text="${nomeParticipante}">Carlos Davi Lopes</span>
            participou, como <span th:text="${papel}">participante</span>, do
            <span th:text="${tipoEvento}">Webinar</span>
            "<span class="highlight" th:text="${nomeCurso}">Título do Curso</span>",
            promovido pelo <span class="highlight" th:text="${entidadeTutora}">Ministério Público</span>,
            <span th:text="${dataExtenso}">no período...</span>,
            de forma <span th:text="${modalidade}">online</span> com carga horária de
            <strong th:text="${cargaHoraria}">48</strong> horas.
        </div>

        <div class="footer-block">
            <span th:text="${cidade}">João Pessoa - PB</span>,
            <span th:text="${dataGeracaoExtenso}">31 de março de 2026</span>.
        </div>
    </div>

    <div class="footer-block-nomeCurso">
        <span class="label-tipo" th:text="${tipoEvento}">Webinar</span>
        <span class="nome-curso-footer" th:text="${descricaoCurso}">Descrição do Curso</span>
    </div>
</body>

</html>
