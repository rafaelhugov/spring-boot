server:
  port: ${PORT:8080}

project:
  name: @project.name@
  version: @project.version@
  description: @project.description@
  openapi:
    url: ${PROJECT_OPENAPI_URL:http://localhost:${server.port}/}

sistema:
  sigla: NCAP

api:
  auth:
    url: "${AUTH_SERVICE_URL:https://auth-api.mppb.mp.br}"
  cnmp:
    base-url: "${CNMP_API_BASE_URL:https://homologacaoeapext.cnmp.mp.br/resolucoes/seam/resource/rest/}"
    username: "${CNMP_API_USER:mock}"
    password: "${CNMP_API_PASSWORD:mock}"
    forms: "${CNMP_API_FORMS:1567,1566,1565,1562}"

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: ncap
  profiles:
    # prod     = usar em produção (secure)
    # dev      = usar em desenvolvimento (trace)
    # insecure = dispensa exigência de token de autorização nas chamadas
    # trace    = força incluir trace na resposta http de erros em qualquer ambiente
    active: ${SPRING_PROFILES_ACTIVE:dev,insecure}

  http:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

  datasource:
    url: ${PG_URL:jdbc:postgresql://10.128.0.7:5436/ncap}
    driverClassName: org.postgresql.Driver
    username: ${PG_USERNAME:marcelo.borba}
    password: ${PG_PASSWORD:minhasenha123}
    hikari:
      maximum-pool-size: ${POOL_MAX:1}
      minimum-idle: ${POOL_MIN:1}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

  sql:
    init:
      mode: never

  jackson:
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd

cors:
  enabled: ${CORS_ENABLED:false}
  access-control-headers:
    allow-origin: ${ACCESS_CONTROL_ALLOW_ORIGIN:*}
    allow-credentials: ${ACCESS_CONTROL_ALLOW_CREDENTIALS:false}

logging:
  level:
    br.gov.mppb.boilerplate: DEBUG
    mppb.restapi.common: DEBUG
    org.springframework.security: INFO
